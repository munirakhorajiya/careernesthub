{% extends 'base.html' %}
{% block title %}Login - CareerNestHub{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div class="card form-wrap">
  <h2 style="margin:0">Welcome back</h2>
  <p class="subtitle">Login as student, company or admin.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="POST">
    {% csrf_token %}
    <label for="login_id">Email / Username</label>
    <input type="text" id="login_id" name="email" placeholder="Email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <label for="account_type">Account type</label>
    <select name="account_type" id="account_type" required onchange="toggleLoginField()">
      <option value="">Select Account Type</option>
      <option value="user">Student / User</option>
      <option value="provider">Company / Provider</option>
      <option value="admin">Admin</option>
    </select>
    <button class="btn" type="submit">Login</button>
  </form>
  <p style="text-align:center;font-size:14px">New here? <a href="{% url 'register' %}">Create account</a></p>
</div>
<script>
function toggleLoginField() {
  var type = document.getElementById('account_type').value;
  var input = document.getElementById('login_id');
  if (type === 'admin') { input.type = 'text'; input.placeholder = 'Username (admin)'; }
  else { input.type = 'email'; input.placeholder = 'Email'; }
}
</script>
{% endblock %}

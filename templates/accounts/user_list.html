{% extends 'base.html' %}
{% block title %}Users - CareerNestHub{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div class="page-head"><div><h2>Users</h2><p class="subtitle">Search and manage students.</p></div></div>
<div class="card">
  <form method="GET" class="searchbar">
    <input type="text" name="name" value="{{ name }}" placeholder="Search by name">
    <button class="btn" type="submit">Search</button>
  </form>
</div>
<div class="grid" style="margin-top:16px">
{% for user in users %}
  <div class="card list-card"><h3>{{ user.name }}</h3><div class="meta"><span>{{ user.email }}</span><span>{{ user.phone }}</span></div></div>
{% empty %}
  <div class="card empty">No users found.</div>
{% endfor %}
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Post Internship - CareerNestHub{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div class="card form-wrap">
  <h2 style="margin:0">Post an Internship</h2>
  <p class="subtitle">Find motivated interns fast.</p>
  <form method="POST">
    {% csrf_token %}
    <label>Title</label><input name="title" placeholder="e.g. Web Design Intern" required>
    <label>Description</label><textarea name="description" placeholder="Work, learnings..." required></textarea>
    <label>Location</label><input name="location" placeholder="Location" required>
    <label>Stipend</label><input name="stipend" placeholder="e.g. 8000/month" required>
    <label>Duration</label><input name="duration" placeholder="e.g. 3 months" required>
    <label>Skills</label><textarea name="skills" placeholder="Required skills" required></textarea>
    <button class="btn" type="submit">Post Internship</button>
  </form>
</div>
{% endblock %}
